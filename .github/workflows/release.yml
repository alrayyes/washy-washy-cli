# release-please decides the version and opens/updates a release pull
# request; merging that PR is what makes it cut the tag and GitHub
# release (via the API, not a git push) -- so unlike the old
# semantic-release setup, nothing here ever pushes to `main` and no
# privileged bypass token is needed. release-auto-merge.yml merges that
# pull request once green, matching the standing "release PRs auto-merge
# on green" convention.
#
# A tag/release created by the default GITHUB_TOKEN starts no further
# workflow run (GitHub refuses, to stop recursive runs), so the OS
# packaging build has to be a second and third job in this same
# workflow, gated on release-please's own `release_created` output --
# not a separate `on: release: published` workflow, which would never
# fire.
name: release

on:
  push:
    branches: [main]
  # For re-running the packaging jobs against an already-cut release,
  # without release-please needing a new PR to merge to do it -- the tag
  # input is a real existing tag, e.g. "v3.0.0".
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build and publish packages for
        required: true

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The default GITHUB_TOKEN can't be this action's token: GitHub
      # refuses to let a GITHUB_TOKEN-authored push or PR trigger further
      # workflow runs (anti-recursion guard), so the release PR this opens
      # would never get a `check` run and could never go green -- exactly
      # what happened before RELEASE_TOKEN existed. A PAT/App token sidesteps
      # that guard entirely.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  # Bun installed via the official script inside a pinned
  # debian:bookworm-slim, not this repo's system/distro-packaged Bun and
  # not directly on the Actions runner -- both matter, see
  # openspec/changes/add-os-packaging/design.md's Decisions section (an
  # older glibc baseline, and a distro-repackaged Bun links against a
  # specific ICU soname most real systems don't ship).
  build-packages:
    needs: release-please
    # always(): a `needs:` job that got skipped (workflow_dispatch skips
    # release-please entirely, see its own `if:`) would otherwise skip
    # this job too by default, regardless of the rest of this condition.
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.release-please.outputs.release_created) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    container: debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      BUN_VERSION: 1.3.14
      NFPM_VERSION: 2.44.1
      GH_CLI_VERSION: 2.98.0
      TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Install build tooling
        run: |
          apt-get update -qq
          apt-get install -y -qq curl unzip ca-certificates scdoc gettext-base gzip

      - name: Install Bun (official installer, not a distro package)
        run: curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash -s -- "bun-v${BUN_VERSION}"

      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          apt-get install -y -qq /tmp/nfpm.deb

      # The `container:` image has none of the bare runner's own tooling,
      # gh included -- "Upload release assets" below needs it, and there's
      # no distro package for it in bookworm's own repos either.
      - name: Install gh
        run: |
          curl -fsSL -o /tmp/gh.deb \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.deb"
          apt-get install -y -qq /tmp/gh.deb

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Build binaries
        run: bun run build:binaries

      - name: Build man page
        run: bun run build:man

      # nfpm's ${VAR} expansion doesn't reach contents[].src (see
      # nfpm.yaml's own comment) -- the explicit variable list matters, a
      # bare envsubst blanks any other ${...}-shaped text in the file.
      # shell: bash, not this container's default sh (dash) -- dash has
      # no -o pipefail, confirmed: "set: Illegal option -o pipefail"
      # broke the first real release before this was caught.
      #
      # NFPM_GOARCH is the bun build --compile target name (x64/arm64),
      # matching nfpm.yaml's `contents[].src:
      # dist/washy-washy-cli-linux-${NFPM_GOARCH}` -- distinct from
      # NFPM_ARCH, the nfpm/Debian arch name (amd64/arm64). An earlier
      # version wired both to the nfpm name and papered over the
      # mismatch with a `cp` aliasing the real build output to an
      # nfpm-named copy; for the arm64 pair the two names are identical,
      # so that cp's source and destination collided and failed the job
      # under `set -e` (confirmed: every release's build-packages job
      # had been failing there, see #158).
      - name: Build .deb and .rpm, one pair per arch
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          for pair in "amd64:x64" "arm64:arm64"; do
            nfpm_arch="${pair%%:*}"
            goarch="${pair##*:}"
            NFPM_ARCH="$nfpm_arch" NFPM_GOARCH="$goarch" NFPM_VERSION="$version" \
              envsubst '$NFPM_ARCH,$NFPM_GOARCH,$NFPM_VERSION' < nfpm.yaml > "/tmp/nfpm-${nfpm_arch}.yaml"
            nfpm package --config "/tmp/nfpm-${nfpm_arch}.yaml" --packager deb \
              --target "dist/washy-washy-cli_${version}_${nfpm_arch}.deb"
            nfpm package --config "/tmp/nfpm-${nfpm_arch}.yaml" --packager rpm \
              --target "dist/washy-washy-cli-${version}.$([ "$nfpm_arch" = amd64 ] && echo x86_64 || echo aarch64).rpm"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/washy-washy-cli-linux-x64
            dist/washy-washy-cli-linux-arm64
            dist/*.deb
            dist/*.rpm

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG_NAME" \
            dist/washy-washy-cli-linux-x64 \
            dist/washy-washy-cli-linux-arm64 \
            dist/washy-washy-cli.1.gz \
            dist/*.deb \
            dist/*.rpm \
            --repo "${{ github.repository }}" \
            --clobber

  publish-aur:
    needs: [release-please, build-packages]
    if: |
      always() &&
      needs.build-packages.result == 'success' &&
      (
        (github.event_name == 'push' && needs.release-please.outputs.release_created) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    container: archlinux:base@sha256:b860afd5823683f7ea389ba5f00d812f4fe55f6f286dea329d2abeefa535e309
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}

      # This container is fresh every run, so `updpkgsums` below always
      # downloads clean and never reproduces the real failure mode: a local
      # source name that doesn't vary with $pkgver gets reused from a prior
      # version's SRCDEST cache on a real machine instead of redownloaded,
      # and then fails checksum against this run's sha256sums (#183). Catch
      # the naming mistake statically instead, since this job can't
      # reproduce the live symptom.
      - name: Regression check -- source names carry $pkgver
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for arr in source_x86_64 source_aarch64; do
            block=$(sed -n "/^${arr}=(/,/^)/p" PKGBUILD)
            while IFS= read -r line; do
              case "$line" in
                *'::'*)
                  name=$(sed -e 's/^[[:space:]]*"//' -e 's/::.*//' <<< "$line")
                  case "$name" in
                    *'$pkgver'*) ;;
                    *)
                      echo "::error::$arr source has no \$pkgver in its local filename, so a version bump can silently reuse a stale cached file (see #183): $line" >&2
                      fail=1
                      ;;
                  esac
                  ;;
              esac
            done <<< "$block"
          done
          exit "$fail"

      - name: Install tooling and a non-root builder
        run: |
          pacman -Sy --noconfirm base-devel pacman-contrib git openssh
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # /home/builder explicitly, not ~ -- this step runs as root, but
      # the Publish step below runs as builder via `su`, which uses
      # builder's own $HOME. Writing to root's ~/.ssh here would leave
      # builder with no key at all.
      - name: Configure the AUR deploy key
        run: |
          install -d -m 700 -o builder -g builder /home/builder/.ssh
          echo "$AUR_SSH_KEY" > /home/builder/.ssh/aur
          ssh-keyscan aur.archlinux.org >> /home/builder/.ssh/known_hosts 2>/dev/null
          {
            echo "Host aur.archlinux.org"
            echo "  IdentityFile ~/.ssh/aur"
            echo "  User aur"
          } >> /home/builder/.ssh/config
          chmod 600 /home/builder/.ssh/aur
          chown builder:builder /home/builder/.ssh/aur /home/builder/.ssh/known_hosts /home/builder/.ssh/config
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

      - name: Publish
        run: su builder -c "VERSION=${TAG_NAME#v} bash scripts/publish-aur.sh"
