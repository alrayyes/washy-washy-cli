# Runs the same commands as the git hooks in lefthook.yml, so the two cannot
# drift: the hook catches it early, this is the gate that cannot be skipped.
#
# Every action is pinned to a commit SHA with the version in the comment. A tag
# like v7 is a mutable pointer someone else controls, and a workflow with write
# permission is not a thing to hand to a moving target.
name: check

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs more than the source it was given.
permissions:
  contents: read

# A push that supersedes an older run cancels it rather than queueing behind it.
# main is excluded: its runs are what the release job waits on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run lint
      - run: bun run lint:md
      - run: bun run lint:package-json
      - run: bun run lint:yaml
      - run: bun run validate-config
      - run: bun run typecheck
      # Coverage instrumentation slows the suite down, which is why the
      # pre-push hook runs plain `bun test` and only CI pays for this.
      - run: bun test --coverage --coverage-reporter=lcov
      # Regular repo secrets, CODECOV_TOKEN included, aren't exposed to runs
      # triggered by dependabot[bot] on pull_request -- a GitHub security
      # boundary, not a config gap. Skip the upload there rather than fail
      # every dependency bump on an empty token.
      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

  # The commit-msg hook already reads every message, but a hook is skippable and
  # these messages are load-bearing: semantic-release reads the Conventional
  # Commits that landed to decide the next version, so a stray "wip" is a
  # release that does not happen. Pull requests only — there is no range to
  # check on a push, and rewriting history to fix an old message is worse than
  # the typo. fetch-depth 0 because the range needs both ends of it.
  #
  # Dependabot is exempt. Its subject is always "Bump x from a to b", and
  # config-conventional's subject-case rule rejects the capital B — which is
  # not something a bot can be argued with about. What lands on main is
  # normalised by the auto-merge workflow's squash subject instead, so main
  # stays conventional without this job failing on every dependency bump.
  commits:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # commitlint resolves @commitlint/config-conventional as a sibling
      # package, so bunx alone will not find it.
      - run: bun install --frozen-lockfile
      - run: bunx --bun commitlint --from "${{ github.event.pull_request.base.sha }}" --to HEAD --verbose

  # Public repo, so this actually catches something Dependabot's own schedule
  # doesn't: a PR introducing a *new* dependency that's already known-bad,
  # checked at merge time rather than waiting for the next scan. Skipped on a
  # private repo needing paid GHAS for it — see rules/releases.md — which
  # doesn't apply here.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Prose gets its own two jobs rather than a line in the one above, so that
  # when the run goes red the job name says which tier failed: a grammar error
  # is a mistake and a style alert is an opinion, answered differently.

  # Mechanics. LanguageTool's rule database — grammar, spelling, punctuation,
  # the phonetic article — and mechanics have a right answer, so this blocks.
  # scripts/lint-prose-ltex.ts is the same script pre-push runs, so the two
  # cannot drift; actions/cache persists its ~300 MB download (keyed on the
  # pinned version) across runs the way a local machine's own disk would.
  ltex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ltex
          key: ltex-18.7.0
      - run: bun run lint:prose:ltex

  # Style. House voice, weasel words, wordiness, undefined jargon. Advice
  # rather than a verdict: Vale exits non-zero only on error-severity alerts,
  # so its warnings are reported without failing anything.
  vale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run prose:sync
      - run: bun run lint:prose:advice

  # hadolint reads the Dockerfile without a daemon. It catches an unpinned
  # base, an apt-get without --no-install-recommends, a RUN cd that quietly
  # does nothing.
  #
  # Then the image is actually built and run, because linting is not building:
  # a Dockerfile can be spotless and still fail on a missing file or a package
  # that has moved. amd64 only here — the release builds arm64 too, and putting
  # an emulated build in front of every pull request buys little.
  dockerfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -i hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552 < Dockerfile
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: washy-washy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The build proving it compiles is worth less than the run proving it
      # works. Both PDFs have to come out of a container started the way the
      # README tells you to start one.
      #
      # --user is not decoration here. The image runs as 1000 and a GitHub
      # runner checks out as 1001, so the bind mount is unwritable without it:
      # "EACCES: permission denied, open '/out/...'". That is the same mismatch
      # anyone whose account is not 1000 will hit, and the same flag the README
      # tells them to reach for — so this runs the documented workaround rather
      # than a special case invented for CI.
      - name: Generate from the bundled chart
        run: |
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/out" washy-washy:ci
          test -s out/washy-washy-phone.pdf
          test -s out/washy-washy-print.pdf

  # The three jobs below prove each OS package actually installs and runs,
  # not just that it builds -- same reasoning as the `dockerfile` job
  # above, applied to AUR/deb/rpm. Each builds its own binary and package
  # locally rather than fetching a published release, so these catch a
  # regression on every pull request, not only after a real release
  # exists to test against. See openspec/changes/add-os-packaging/
  # design.md for why the build step specifically needs Bun's official
  # installer (not a distro package) and, for deb, why the install step
  # needs the non-slim Debian image.
  deb-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the binary, man page, and .deb
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171 \
            bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq curl unzip ca-certificates scdoc gettext-base
              curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash -s -- bun-v1.3.14
              export PATH=/usr/local/bin:$PATH
              bun install --frozen-lockfile --ignore-scripts
              bun build --compile --target=bun-linux-x64 --outfile=dist/washy-washy-cli-linux-amd64 src/cli.ts
              scdoc < man/washy-washy-cli.1.scd > dist/washy-washy-cli.1
              gzip -f dist/washy-washy-cli.1
              curl -fsSL -o /tmp/nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.44.1/nfpm_2.44.1_amd64.deb
              apt-get install -y -qq /tmp/nfpm.deb
              NFPM_ARCH=amd64 NFPM_GOARCH=amd64 NFPM_VERSION=0.0.0-ci \
                envsubst \"\$NFPM_ARCH,\$NFPM_GOARCH,\$NFPM_VERSION\" < nfpm.yaml > /tmp/nfpm.yaml
              nfpm package --config /tmp/nfpm.yaml --packager deb --target dist/washy-washy-cli-ci_amd64.deb
            '
      # Not -slim: it path-excludes /usr/share/man and /usr/share/doc
      # (Docker's own size-reduction default, not anything a real
      # Debian/Ubuntu install carries), which would silently pass this
      # check even if the man page never shipped.
      - name: Install and run in a real Debian container
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            debian:bookworm@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443 \
            bash -c '
              set -euo pipefail
              apt-get update -qq && apt-get install -y -qq man-db
              dpkg -i dist/washy-washy-cli-ci_amd64.deb
              washy-washy-cli data/washy-washy.json.dist --out /tmp/out
              test -s /tmp/out/washy-washy-phone.pdf
              test -s /tmp/out/washy-washy-print.pdf
              man washy-washy-cli | grep -q "turn a laundry chart"
            '

  rpm-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the binary, man page, and .rpm
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171 \
            bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq curl unzip ca-certificates scdoc gettext-base
              curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash -s -- bun-v1.3.14
              export PATH=/usr/local/bin:$PATH
              bun install --frozen-lockfile --ignore-scripts
              bun build --compile --target=bun-linux-x64 --outfile=dist/washy-washy-cli-linux-amd64 src/cli.ts
              scdoc < man/washy-washy-cli.1.scd > dist/washy-washy-cli.1
              gzip -f dist/washy-washy-cli.1
              curl -fsSL -o /tmp/nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.44.1/nfpm_2.44.1_amd64.deb
              apt-get install -y -qq /tmp/nfpm.deb
              NFPM_ARCH=amd64 NFPM_GOARCH=amd64 NFPM_VERSION=0.0.0-ci \
                envsubst \"\$NFPM_ARCH,\$NFPM_GOARCH,\$NFPM_VERSION\" < nfpm.yaml > /tmp/nfpm.yaml
              nfpm package --config /tmp/nfpm.yaml --packager rpm --target dist/washy-washy-cli-ci.x86_64.rpm
            '
      - name: Install and run in Fedora
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            fedora:41@sha256:f1a3fab47bcb3c3ddf3135d5ee7ba8b7b25f2e809a47440936212a3a50957f3d \
            bash -c '
              set -euo pipefail
              dnf install -y -q man-db util-linux >/dev/null
              rpm -i dist/washy-washy-cli-ci.x86_64.rpm
              washy-washy-cli data/washy-washy.json.dist --out /tmp/out
              test -s /tmp/out/washy-washy-phone.pdf
              test -s /tmp/out/washy-washy-print.pdf
              man washy-washy-cli | grep -q "turn a laundry chart"
            '

  # Against a locally-built binary, not the published AUR git -- there is
  # no real release to fetch on most pull requests, and PKGBUILD's
  # source= entries fall back to a plain local file when given a bare
  # filename with no URL scheme (confirmed: makepkg copies it straight
  # from the PKGBUILD's own directory, no network involved).
  aur-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and install with makepkg
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            archlinux:base@sha256:b860afd5823683f7ea389ba5f00d812f4fe55f6f286dea329d2abeefa535e309 \
            bash -c '
              set -euo pipefail
              # The official archlinux image ships a pacman.conf with
              # NoExtract = usr/share/man/* -- Dockers own size-saving
              # default, not anything a real Arch install carries.
              # Without removing it, this whole job silently "passes"
              # while never actually installing the man page it is here
              # to check for.
              sed -i "/^NoExtract.*usr\/share\/man/d" /etc/pacman.conf
              pacman -Sy --noconfirm base-devel curl unzip scdoc gawk man-db >/dev/null
              curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash -s -- bun-v1.3.14
              export PATH=/usr/local/bin:$PATH
              (cd /work && bun install --frozen-lockfile --ignore-scripts)
              mkdir -p /tmp/ci-pkg && cd /tmp/ci-pkg
              bun build --compile --target=bun-linux-x64 \
                --outfile="washy-washy-cli-0.0.0-x86_64" /work/src/cli.ts
              scdoc < /work/man/washy-washy-cli.1.scd | gzip > washy-washy-cli-0.0.0.1.gz
              # A minimal PKGBUILD for this test, reusing only the real
              # package() body below -- the real source= entries need an
              # actual release to fetch, which does not exist on most pull
              # requests. A bare local filename with no URL scheme stands
              # in for one (confirmed: makepkg copies it straight from its
              # own directory, no network involved). printf, not a
              # heredoc: a heredoc terminator cannot carry the leading
              # indentation this file (and YAML block scalars generally)
              # would otherwise give it.
              printf "%s\n" \
                "pkgname=washy-washy-cli-bin" \
                "pkgver=0.0.0" \
                "pkgrel=1" \
                "arch=(x86_64)" \
                "url=\"https://github.com/alrayyes/washy-washy-cli\"" \
                "license=(GPL-3.0-or-later)" \
                "depends=(glibc)" \
                "options=(!strip !debug)" \
                "source=(\"washy-washy-cli-0.0.0-x86_64\" \"washy-washy-cli-0.0.0.1.gz\")" \
                "sha256sums=(\"SKIP\" \"SKIP\")" \
                > PKGBUILD
              awk "/^package\(\)/,0" /work/PKGBUILD >> PKGBUILD
              useradd -m builder && chown -R builder:builder /tmp/ci-pkg
              su builder -c "cd /tmp/ci-pkg && makepkg --noconfirm"
              pacman -U --noconfirm /tmp/ci-pkg/*.pkg.tar.zst
              washy-washy-cli /work/data/washy-washy.json.dist --out /tmp/out
              test -s /tmp/out/washy-washy-phone.pdf
              test -s /tmp/out/washy-washy-print.pdf
              man washy-washy-cli | grep -q "turn a laundry chart"
            '

  # #183: a stale man page survived a version bump because its local
  # source filename didn't carry $pkgver, so makepkg reused whatever a
  # prior version's build had already downloaded into the same directory
  # instead of fetching the new one. aur-install (above) only ever builds
  # one pkgver per run, so it can't exercise that reuse path at all --
  # this job builds the repo's real source_x86_64 array and package()
  # (only the GitHub host is swapped for a local one) against two fake
  # releases served from a local HTTP server, back to back in the same
  # directory, and checks the second build actually installs the second
  # release's man page rather than the first's.
  aur-version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build v1, then v2 in the same directory, and check for stale reuse
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            archlinux:base@sha256:b860afd5823683f7ea389ba5f00d812f4fe55f6f286dea329d2abeefa535e309 \
            bash -c '
              set -euo pipefail
              sed -i "/^NoExtract.*usr\/share\/man/d" /etc/pacman.conf
              pacman -Sy --noconfirm base-devel curl unzip scdoc gawk python >/dev/null
              curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash -s -- bun-v1.3.14
              export PATH=/usr/local/bin:$PATH
              (cd /work && bun install --frozen-lockfile --ignore-scripts)

              mkdir -p /srv/assets/v1.0.0 /srv/assets/v1.1.0
              bun build --compile --target=bun-linux-x64 \
                --outfile=/srv/assets/v1.0.0/washy-washy-cli-linux-x64 /work/src/cli.ts
              cp /srv/assets/v1.0.0/washy-washy-cli-linux-x64 /srv/assets/v1.1.0/washy-washy-cli-linux-x64
              # Same real man page, one distinguishing line appended per
              # fake release -- enough to tell which one actually landed
              # without needing the two releases to differ for real.
              scdoc < /work/man/washy-washy-cli.1.scd > /tmp/man.scd.out
              { cat /tmp/man.scd.out; printf "\n.\\\" fake-release-v1\n"; } | gzip > /srv/assets/v1.0.0/washy-washy-cli.1.gz
              { cat /tmp/man.scd.out; printf "\n.\\\" fake-release-v2\n"; } | gzip > /srv/assets/v1.1.0/washy-washy-cli.1.gz
              (cd /srv/assets && python -m http.server 8899 --bind 127.0.0.1 &>/tmp/httpd.log &)
              sleep 1

              # The real source_x86_64 and package() -- unmodified except
              # for pointing at the local server instead of GitHub -- so a
              # future PKGBUILD edit is what this job re-checks, not a
              # hand-copied stand-in that could silently drift from it.
              mkdir -p /tmp/ci-bump && cd /tmp/ci-bump
              {
                echo "pkgname=washy-washy-cli-bin"
                echo "pkgver=0.0.0"
                echo "pkgrel=1"
                echo "arch=(x86_64)"
                echo "options=(!strip !debug)"
                sed -n "/^source_x86_64=(/,/^)/p" /work/PKGBUILD \
                  | sed "s#https://github.com/alrayyes/washy-washy-cli/releases/download#http://127.0.0.1:8899#"
                echo "sha256sums_x86_64=(\"SKIP\" \"SKIP\")"
                awk "/^package\(\)/,0" /work/PKGBUILD
              } > PKGBUILD
              useradd -m builder && chown -R builder:builder /tmp/ci-bump

              for ver in 1.0.0 1.1.0; do
                sed -i "s/^pkgver=.*/pkgver=$ver/" PKGBUILD
                chown builder:builder PKGBUILD
                rm -f *.pkg.tar.zst
                su builder -c "makepkg --noconfirm -f"
                pacman -U --noconfirm ./*.pkg.tar.zst
              done

              zcat /usr/share/man/man1/washy-washy-cli.1.gz | grep -q "fake-release-v2" || {
                echo "::error::the second build installed a stale man page from the first version instead of its own -- see #183" >&2
                exit 1
              }
            '

  # The PDFs themselves, kept as an artifact so a reviewer can read the thing
  # rather than a description of it.
  pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run generate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: washy-washy-pdfs
          path: out/
          retention-days: 30

  # Unlike movie-planner/hush-hush/linkwarden-obsidian-sync's own nix-flake
  # jobs, this one fetches a real GitHub Release asset rather than building
  # from source (see flake.nix's own comment for why: a `bun build
  # --compile` binary built with nixpkgs' own Bun links against the wrong
  # libicu/libstdc++). That means this job can only go green once a real
  # release has actually published washy-washy-cli-linux-x64/.1.gz assets
  # -- blocked until #159 merges and that release gets re-dispatched.
  nix-flake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix flake check
      - run: nix build .#default
      - run: ./result/bin/washy-washy-cli --help
