# Every dependency here is pinned to an exact version, which is the whole
# reason this file earns its place: a pinned version cannot drift, so the
# upgrade has to arrive as a pull request that runs the tests rather than as a
# resolution nobody reviewed.
version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      # commitlint gates every commit that lands, and Dependabot's default
      # subject is not a Conventional Commit. chore: is right for a dev
      # dependency and deps: would release nothing, so production bumps say
      # fix: and take a patch.
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # One pull request for the linters rather than five. They move together,
      # they are all development-only, and each one on its own is a review
      # nobody learns anything from.
      linters:
        dependency-type: development
        patterns:
          - "@biomejs/*"
          - "@commitlint/*"
          - prettier
          - markdownlint-cli2
          - lefthook

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Changes the pipeline, not the artifact - releasing for this is noise.
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The base image ships in publish-image.yml's built image, so a bump here
    # changes what ships whether or not it's security-relevant - same
    # reasoning as bun's production dependencies above.
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    # flake.nix wraps a prebuilt release binary rather than building one --
    # nixpkgs/flake-utils only supply the fetch-and-install tooling, not
    # anything that ends up in what ships, so a bump here is dev tooling
    # like bun's own devDependencies above, not a release-worthy fix.
    commit-message:
      prefix: chore
      include: scope

  # The stub Dockerfile that pins gitleaks for .github/workflows/gitleaks.yml.
  # Dependabot doesn't read a workflow's `container:`, so the pin lives here.
  # ci: because it changes the pipeline, not what ships.
  - package-ecosystem: docker
    directory: /.github/gitleaks
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
      include: scope
    # A group, even of one, keeps a bump on Dependabot's lowercase group-title
    # template instead of the sentence-case single-update one, which fails
    # commitlint's subject-case rule.
    groups:
      gitleaks:
        patterns: ["*"]
        update-types: [minor, patch]
      gitleaks-major:
        patterns: ["*"]
        update-types: [major]
